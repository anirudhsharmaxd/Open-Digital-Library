<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <!-- Background orbs -->
  <circle cx="450" cy="250" r="200" fill="rgba(16,185,129,0.06)"/>
  <circle cx="150" cy="600" r="180" fill="rgba(6,182,212,0.05)"/>
  <!-- Scatter plot dots -->
  <g filter="url(#glow)" opacity="0.6">
    <circle cx="120" cy="380" r="6" fill="#10b981"/>
    <circle cx="160" cy="420" r="4" fill="#34d399"/>
    <circle cx="200" cy="360" r="7" fill="#fbbf24"/>
    <circle cx="180" cy="450" r="5" fill="#06b6d4"/>
    <circle cx="240" cy="400" r="8" fill="#10b981"/>
    <circle cx="280" cy="340" r="5" fill="#fbbf24"/>
    <circle cx="300" cy="390" r="6" fill="#34d399"/>
    <circle cx="320" cy="360" r="9" fill="#06b6d4"/>
    <circle cx="350" cy="420" r="4" fill="#fbbf24"/>
    <circle cx="370" cy="370" r="7" fill="#10b981"/>
    <circle cx="400" cy="350" r="5" fill="#34d399"/>
    <circle cx="420" cy="310" r="8" fill="#fbbf24"/>
    <circle cx="450" cy="380" r="6" fill="#06b6d4"/>
    <circle cx="470" cy="340" r="4" fill="#10b981"/>
    <circle cx="140" cy="500" r="5" fill="#34d399"/>
    <circle cx="250" cy="470" r="6" fill="#fbbf24"/>
    <circle cx="340" cy="460" r="5" fill="#06b6d4"/>
    <circle cx="430" cy="440" r="7" fill="#10b981"/>
    <circle cx="490" cy="400" r="5" fill="#fbbf24"/>
  </g>
  <!-- Trend line -->
  <g filter="url(#glow)" opacity="0.4">
    <line x1="100" y1="480" x2="500" y2="300" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8,4"/>
  </g>
  <!-- Bell curve -->
  <g filter="url(#glow)" opacity="0.35">
    <path d="M80 620 Q150 620 200 600 Q250 570 300 520 Q350 570 400 600 Q450 620 520 620" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M80 620 Q150 620 200 600 Q250 570 300 520 Q350 570 400 600 Q450 620 520 620 L520 650 L80 650 Z" fill="rgba(251,191,36,0.06)"/>
  </g>
  <!-- Data flow lines -->
  <g opacity="0.15">
    <path d="M50 680 Q150 660 250 680 Q350 700 450 680 Q550 660 600 680" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <path d="M0 720 Q100 700 200 720 Q300 740 400 720 Q500 700 600 720" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  </g>
  <!-- Category badge -->
  <rect x="30" y="30" width="170" height="38" rx="19" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="115" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="2">DATA SCIENCE</text>
  <!-- Title -->
  <text x="300" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="300" fill="rgba(255,255,255,0.55)" letter-spacing="1">Computational &amp;</text>
  <text x="300" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="white">Inferential</text>
  <text x="300" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="900" fill="url(#accent)" letter-spacing="2">Thinking</text>
  <!-- Subtitle -->
  <text x="300" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" letter-spacing="2">THE FOUNDATIONS OF DATA SCIENCE</text>
  <line x1="180" y1="298" x2="420" y2="298" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <!-- Bottom section -->
  <rect x="0" y="790" width="600" height="110" fill="rgba(0,0,0,0.4)"/>
  <text x="300" y="830" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" letter-spacing="3">WRITTEN BY</text>
  <text x="300" y="860" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.9)">Ani Adhikari &amp; John DeNero</text>
</svg>
